# Cursor agent discovery, as observed. This file is embedded by crates/agent-tail/build.rs.
schema = 1
harness = "cursor"
name = "Cursor"

[roots]
# Cursor files transcripts by encoded workspace path below projects/.
default = ".cursor/projects"
evidence = "docs/formats/cursor.md#paths-and-layout"

[layout]
# <project>/agent-transcripts/<id>/<id>.jsonl, with subagents beside it.
max_depth = 4
session_pattern = "*.jsonl"
sessions_in = "agent-transcripts"
helpers_in = "subagents"
helper_owner = "session_folder"
day_folders = false
evidence = "docs/formats/cursor.md#paths-and-layout; crates/agent-tail/src/adapters/cursor.rs"

[project]
source = "workspace paths in prompts and tool calls; the encoded <project> folder is the fallback until a path is found"
encoding = "project folders replace every run of non-alphanumeric characters with '-'; like Claude's, the encoding is lossy and is not decoded as the source of truth"
evidence = "docs/formats/cursor.md#paths-and-layout; crates/agent-tail/src/adapters/cursor.rs"

[[project.examples]]
cwd = "/Users/dev/work/demo-app"
folder = "Users-dev-work-demo-app"

[[project.examples]]
cwd = "/Users/dev/work/My App"
folder = "Users-dev-work-My-App"

[timestamps]
field = "none"
format = "none (prompts carry an English <timestamp> block to the minute)"
timezone = "the prompt's explicit UTC offset"
fallback = "file mtime for every other entry; a future prompt is capped at the file mtime"
evidence = "docs/formats/cursor.md#status-signals; crates/agent-tail/src/adapters/cursor.rs"

[asks_user]
# Names from an earlier Cursor adapter. None were seen in the Cursor corpus, so this is
# ported-unverified; the match is case- and separator-insensitive as Cursor's names vary.
match = "alnum_lower"
evidence = "docs/formats/cursor.md#transcript-record-catalogue-main-counts; crates/agent-tail/src/adapters/cursor.rs"
values = [
  { name = "AskQuestion", evidence = "ported-unverified: earlier adapter, no Cursor corpus sighting" },
  { name = "AskUserQuestion", evidence = "ported-unverified: earlier adapter, no Cursor corpus sighting" },
  { name = "AskFollowupQuestion", evidence = "ported-unverified: earlier adapter, no Cursor corpus sighting" },
  { name = "RequestUserInput", evidence = "ported-unverified: earlier adapter, no Cursor corpus sighting" },
]

[never_prompt]
# No approval prompt, auto-run setting, or never-prompt tool was observed in the Cursor
# corpus. Do not infer one from Claude's or Codex's lists.
evidence = "docs/formats/cursor.md#status-signals; docs/formats/cursor.md#open-questions"
values = []

[modes]
# Transcripts carry no permission mode; Cursor's auto-run settings are unknown. The
# state.vscdb may hold one, but it is not read yet.
evidence = "docs/formats/cursor.md#status-signals; docs/formats/cursor.md#open-questions"
values = []

[[quirks]]
id = "no-tool-results"
summary = "Cursor records tool calls but no results; an assistant text/thinking block after a call is the evidence that the result is in."
evidence = "docs/formats/cursor.md#transcript-record-catalogue-main-counts; crates/agent-tail/src/adapters/cursor.rs"

[[quirks]]
id = "turn-ended-errors-are-user-stops"
summary = "Every `turn_ended` with `status: error` in the corpus was a user stop (`User aborted request`, `user_stopped_generation`, `new_message_submitted`), not a failure."
evidence = "docs/formats/cursor.md#transcript-record-catalogue-main-counts; crates/agent-tail/src/adapters/cursor.rs"

[[quirks]]
id = "lossy-project-folders"
summary = "The <project> folder is a lossy encoding of the workspace path, so the project name is recovered from a workspace path in the transcript when one appears."
evidence = "docs/formats/cursor.md#paths-and-layout; crates/agent-tail/src/adapters/cursor.rs"

[[quirks]]
id = "state-vscdb-snapshot"
summary = "`state.vscdb` is copied with -wal/-shm to a private temp dir and opened read-only; composerData status/name and bubbleId toolFormerData are read. A pending bubble decision is firm AwaitingApproval (or AwaitingAnswer for ask-user tools), so Cursor no longer uses the 20 s stall inference; the live wait capture is still outstanding."
evidence = "docs/formats/cursor.md#reader-b9-2026-10-24; docs/formats/cursor.md#live-approval-wait-capture; crates/agent-tail/src/sqlite.rs"

[[quirks]]
id = "no-real-harness-run"
summary = "Earlier investigation found cursor-agent needs Cursor's auth and private Connect/protobuf streaming protocol, so Cursor is not in the mock/PTY CI; donated fixtures are the v0.1 path."
evidence = "harness-ci/README.md; docs/formats/cursor.md#cursor-cli-and-the-mockpty-rig"
