[package]
name = "agenttail-cli"
description = "agenttail on the command line: list and watch coding-agent sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "agenttail"
path = "src/main.rs"

[dependencies]
agenttail = { workspace = true, features = ["fs"] }
serde.workspace = true
# Fixture redaction keeps the order fields were written in.
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3.27.0"
