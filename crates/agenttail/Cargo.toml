[package]
name = "agenttail"
description = "What every coding agent on this machine is doing right now, read from its session transcripts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["fs", "sqlite"]
# Finding and tailing transcripts on this machine's disk (`Tracker`). Without it the crate
# is sans-IO: bytes in, state out.
fs = []
# Reading Cursor's `state.vscdb` from a private, read-only snapshot (`sqlite`).
sqlite = ["dep:rusqlite"]

[dependencies]
memchr.workspace = true
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"], optional = true }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
serde.workspace = true
toml = "1.1.8"

[dev-dependencies]
proptest = "1.6"
tempfile = "3.27.0"

[[bench]]
name = "first_read"
harness = false
required-features = ["fs"]
