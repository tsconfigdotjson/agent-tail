[package]
name = "harness-driver"
description = "Runs a coding-agent CLI under a PTY and scores agent-tail's status against its screen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "harness-driver"
path = "src/main.rs"

[dependencies]
agent-tail = { path = "../../crates/agent-tail", features = ["fs"] }
axum = "0.8"
mock-server = { path = "../mock-server" }
portable-pty = "0.8"
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
vt100 = "0.15"
