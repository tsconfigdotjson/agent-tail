services:
  desktop:
    build:
      context: .
      args:
        INSTALL_CLAUDE_DESKTOP: "${INSTALL_CLAUDE_DESKTOP:-1}"
        CLAUDE_DESKTOP_VERSION: "${CLAUDE_DESKTOP_VERSION:-3.6556.2}"
    init: true
    shm_size: "1gb"
    environment:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      AGENT_TAIL_JEV_MODEL: "${AGENT_TAIL_JEV_MODEL:-typesafe/jev-1.14}"
      AGENT_TAIL_JEV_CONFIDENCE: "${AGENT_TAIL_JEV_CONFIDENCE:-}"
      AGENT_TAIL_CDP_PORT: "${AGENT_TAIL_CDP_PORT:-}"
      AGENT_TAIL_SCREEN: "${AGENT_TAIL_SCREEN:-1440x900x24}"
      AGENT_TAIL_BIN: /repo/target/release/agent-tail
      AGENT_TAIL_MOCK_SERVER: /repo/harness-ci/target/release/mock-server
    network_mode: "${AGENT_TAIL_DOCKER_NETWORK:-bridge}"
    volumes:
      - ../..:/repo:ro
      - ./runs:/out
    # No --privileged, no /dev/kvm: this is Xvfb-only. Cowork needs KVM and is
    # explicitly outside this stopgap.
