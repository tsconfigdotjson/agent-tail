[package]
name = "mock-server"
description = "A scripted Anthropic Messages / OpenAI Responses model server for harness CI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mock_server"
path = "src/lib.rs"

[[bin]]
name = "mock-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
