[workspace]
resolver = "3"
members = ["crates/agent-tail", "crates/agent-tail-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Let chains (`if let … && …`) need 1.88.
rust-version = "1.88"
repository = "https://github.com/tsconfigdotjson/agent-tail"
license = "MIT"
publish = false

[workspace.dependencies]
agent-tail = { path = "crates/agent-tail" }
memchr = "2.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
