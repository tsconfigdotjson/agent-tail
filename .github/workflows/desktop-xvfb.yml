# Desktop Xvfb nightly and manual lanes.
#
# The nightly schedule always runs the offline stand-in observe/act/score job.
# When the OPENROUTER_API_KEY Actions secret is present, the same schedule also
# runs the live Jev Desktop lane; without the secret that lane is skipped cleanly
# and the stand-in is unaffected. The live lane can also be run manually with
# workflow_dispatch. It is never part of the push/PR matrix, so pull requests do
# not spend OpenRouter credits. The stand-in is an offline plumbing test, not a
# claim that Claude Desktop is CI-verified.
name: Desktop Xvfb (nightly)

on:
  schedule:
    # Same cadence as the harness-ci nightly. Desktop stays out of push/PR.
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      run_desktop_probe:
        description: "Install Claude Desktop and probe its Xvfb launch (heavier)"
        type: boolean
        default: false
      run_live_jev:
        description: "Run the live Jev Desktop lane (requires the OPENROUTER_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-xvfb-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  standin:
    name: Xvfb stand-in observe/act/score
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version

      - name: Build agent-tail
        run: cargo build --release --locked -p agent-tail-cli

      - name: Run offline stand-in scenario
        env:
          INSTALL_CLAUDE_DESKTOP: "0"
        run: harness-ci/desktop-xvfb/run.sh standin

      - name: Upload Xvfb failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-xvfb-standin
          path: harness-ci/desktop-xvfb/runs
          if-no-files-found: warn
          retention-days: 3

  desktop-probe:
    name: Claude Desktop Xvfb launch probe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_desktop_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version

      - name: Build agent-tail
        run: cargo build --release --locked -p agent-tail-cli

      - name: Probe the 3P welcome screen under Xvfb
        env:
          INSTALL_CLAUDE_DESKTOP: "1"
        run: harness-ci/desktop-xvfb/run.sh desktop-probe

      - name: Upload Xvfb failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-xvfb-probe
          path: harness-ci/desktop-xvfb/runs
          if-no-files-found: warn
          retention-days: 3

  live-key:
    name: Check live-lane credentials
    # Nightly runs opt in by default when the secret exists. Manual dispatches
    # still need run_live_jev=true. The check job skips the live lane cleanly
    # when the secret is absent without failing the stand-in.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_live_jev)
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check OPENROUTER_API_KEY
        id: check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -n "${OPENROUTER_API_KEY:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY is set; the live Jev lane will run and spend credits." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY is not set; skipping the live Jev lane. Add the Actions secret to enable it on the next nightly." >> "$GITHUB_STEP_SUMMARY"
          fi

  desktop-live:
    name: Live Jev Desktop
    needs: live-key
    if: ${{ needs.live-key.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version

      - name: Build agent-tail
        run: cargo build --release --locked -p agent-tail-cli

      # Jev only chooses UI actions. The driver scrubs writer credentials, and
      # agent-tail scores the Desktop audit log written on disk.
      - name: Run live Jev Desktop scenario
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_TAIL_JEV_MODEL: typesafe/jev-1.14
          INSTALL_CLAUDE_DESKTOP: "1"
        run: harness-ci/desktop-xvfb/run.sh desktop

      - name: Upload Xvfb failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-xvfb-live
          path: harness-ci/desktop-xvfb/runs
          if-no-files-found: warn
          retention-days: 3
