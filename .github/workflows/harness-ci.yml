name: Harness CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/harness-ci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "fixtures/**"
      - "harness-ci/**"
  pull_request:
    paths:
      - ".github/workflows/harness-ci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "fixtures/**"
      - "harness-ci/**"
  schedule:
    # Nightly: install each lane's latest release, run the same matrix, compare transcript shapes.
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      open_drift_pr:
        description: "Open a PR when the latest CLI changes transcript shape"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  unit:
    name: harness-ci unit and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
          rustup default 1.88.0
          rustc --version

      - name: Format, clippy, and unit tests
        working-directory: harness-ci
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p harness-driver -p mock-server --locked

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Survey, nightly and desktop-Xvfb tool tests
        run: |
          python3 -m unittest discover -s harness-ci/ci -p 'test_*.py' -v
          python3 -m unittest discover -s harness-ci/desktop-xvfb -p 'test_*.py' -v

  fixtures:
    name: Fixture redaction scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version

      - name: Scan fixtures for secrets and home paths
        run: cargo run --locked -p agenttail-cli -- fixture scan fixtures

  first-read:
    name: First read time and RSS budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version

      - name: Enforce first-read budget
        run: harness-ci/ci/first-read-budget.sh

  prepare:
    name: Resolve npm latest Claude Code and OpenCode
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      opencode_matrix: ${{ steps.opencode.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the pinned + latest Claude Code matrix once
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          latest="$(npm view @anthropic-ai/claude-code version)"
          echo "Claude Code npm latest: $latest"
          python3 harness-ci/ci/matrix.py claude-code --latest "$latest" --github-output >> "$GITHUB_OUTPUT"

      - name: Build the pinned + latest OpenCode matrix once
        id: opencode
        shell: bash
        run: |
          set -euo pipefail
          latest="$(npm view opencode-ai version)"
          echo "OpenCode npm latest: $latest"
          python3 harness-ci/ci/matrix.py opencode --latest "$latest" --github-output >> "$GITHUB_OUTPUT"

  prepare-codex:
    name: Resolve npm latest Codex
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the pinned + latest Codex matrix once
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          latest="$(npm view @openai/codex version)"
          echo "Codex npm latest: $latest"
          python3 harness-ci/ci/matrix.py codex --latest "$latest" --github-output >> "$GITHUB_OUTPUT"

  prepare-cursor:
    name: Resolve Cursor Agent latest
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the pinned + latest Cursor Agent matrix once
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/cursor-install.sh"
          curl -fsSL --retry 5 --retry-delay 2 https://cursor.com/install -o "$installer"
          latest="$(python3 harness-ci/ci/cursor_version.py --installer "$installer")"
          echo "Cursor Agent latest: $latest"
          python3 harness-ci/ci/matrix.py cursor --latest "$latest" --github-output >> "$GITHUB_OUTPUT"

  prepare-pi:
    name: Resolve npm latest Pi
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the pinned + latest Pi matrix once
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          latest="$(npm view @earendil-works/pi-coding-agent version)"
          echo "Pi npm latest: $latest"
          python3 harness-ci/ci/matrix.py pi --latest "$latest" --github-output >> "$GITHUB_OUTPUT"

  prepare-gemini:
    name: Resolve npm latest Gemini CLI
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the pinned + latest Gemini CLI matrix once
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          latest="$(npm view @google/gemini-cli version)"
          echo "Gemini CLI npm latest: $latest"
          python3 harness-ci/ci/matrix.py gemini --latest "$latest" --github-output >> "$GITHUB_OUTPUT"

  prepare-copilot:
    name: Resolve npm latest Copilot CLI
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the pinned + latest Copilot CLI matrix once
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          latest="$(npm view @github/copilot version)"
          echo "Copilot CLI npm latest: $latest"
          python3 harness-ci/ci/matrix.py copilot --latest "$latest" --github-output >> "$GITHUB_OUTPUT"

  harness:
    name: Claude Code ${{ matrix.label }} (${{ matrix.version }}) on ${{ matrix.os }}
    needs: [unit, prepare]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      # macOS uses sandbox-exec; Linux uses a network namespace. No real API key is ever
      # available: the driver supplies a dummy key that only the local mock sees.
      HARNESS_CI_REQUIRE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude Code ${{ matrix.version }}
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ matrix.version }}'
          echo "npm latest: $(npm view @anthropic-ai/claude-code version)"
          prefix="$RUNNER_TEMP/claude-$requested"
          npm install --prefix "$prefix" --no-save --no-audit --no-fund "@anthropic-ai/claude-code@$requested"
          bin="$prefix/node_modules/.bin/claude"
          actual="$("$bin" --version | head -n1 | awk '{print $1}')"
          test -n "$actual"
          if [[ "$actual" != "$requested" ]]; then
            echo "installed $actual, wanted $requested" >&2
            exit 1
          fi
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
          echo "CLAUDE_VERSION=$actual" >> "$GITHUB_ENV"
          echo "CLAUDE_BIN=$bin" >> "$GITHUB_ENV"
          echo "Testing Claude Code $actual"

      - name: Build harness-ci explicitly
        working-directory: harness-ci
        run: cargo build -p harness-driver --release --locked

      - name: Run Claude Code scenarios offline
        shell: bash
        run: |
          set -uo pipefail
          runs="$RUNNER_TEMP/harness-runs"
          rm -rf "$runs"
          mkdir -p "$runs"
          failed=0
          while IFS= read -r scenario; do
            [[ -z "$scenario" || "$scenario" == \#* ]] && continue
            echo "::group::$scenario ($CLAUDE_VERSION on ${{ runner.os }})"
            if ! harness-ci/ci/offline-run.sh \
              "$PWD/harness-ci/target/release/harness-driver" \
              --scenario "$PWD/harness-ci/driver/scenarios/$scenario.json" \
              --out "$runs/$scenario"; then
              failed=1
            fi
            echo "::endgroup::"
          done < harness-ci/ci/scenarios.txt
          exit "$failed"

      - name: Survey transcript shape
        if: always()
        run: |
          python3 harness-ci/ci/survey.py survey \
            --runs "$RUNNER_TEMP/harness-runs" \
            --harness claude_code \
            --version "$CLAUDE_VERSION" \
            --os "${{ runner.os }}" \
            --out "$RUNNER_TEMP/harness-runs/shape.json"

      - name: Upload runs and shape
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.label }}-${{ runner.os }}
          path: ${{ runner.temp }}/harness-runs
          if-no-files-found: warn
          retention-days: 7

  pi:
    name: Pi ${{ matrix.label }} (${{ matrix.version }}) on ${{ matrix.os }}
    needs: [unit, prepare-pi]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-pi.outputs.matrix) }}
    env:
      # Pi runs in JSON mode against the in-process mock. The driver supplies a dummy key
      # and points a custom Anthropic-compatible provider at localhost only.
      HARNESS_CI_REQUIRE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pi ${{ matrix.version }}
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ matrix.version }}'
          echo "npm latest Pi: $(npm view @earendil-works/pi-coding-agent version)"
          prefix="$RUNNER_TEMP/pi-$requested"
          npm install --prefix "$prefix" --no-save --no-audit --no-fund "@earendil-works/pi-coding-agent@$requested"
          bin="$prefix/node_modules/.bin/pi"
          actual="$("$bin" --version | head -n1 | awk '{print $1}')"
          test -n "$actual"
          if [[ "$actual" != "$requested" ]]; then
            echo "installed $actual, wanted $requested" >&2
            exit 1
          fi
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
          echo "PI_VERSION=$actual" >> "$GITHUB_ENV"
          echo "PI_BIN=$bin" >> "$GITHUB_ENV"
          echo "Testing Pi $actual"

      - name: Build harness-ci explicitly
        working-directory: harness-ci
        run: cargo build -p harness-driver --release --locked

      - name: Run Pi scenarios offline
        shell: bash
        run: |
          set -uo pipefail
          runs="$RUNNER_TEMP/pi-runs"
          rm -rf "$runs"
          mkdir -p "$runs"
          failed=0
          while IFS= read -r scenario; do
            [[ -z "$scenario" || "$scenario" == \#* ]] && continue
            echo "::group::$scenario ($PI_VERSION on ${{ runner.os }})"
            if ! harness-ci/ci/offline-run.sh \
              "$PWD/harness-ci/target/release/harness-driver" \
              --scenario "$PWD/harness-ci/driver/scenarios/$scenario.json" \
              --out "$runs/$scenario"; then
              failed=1
            fi
            echo "::endgroup::"
          done < harness-ci/ci/scenarios-pi.txt
          exit "$failed"

      - name: Upload runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-${{ matrix.label }}-${{ runner.os }}
          path: ${{ runner.temp }}/pi-runs
          if-no-files-found: warn
          retention-days: 7

  codex:
    name: Codex ${{ matrix.label }} (${{ matrix.version }}) on ${{ matrix.os }}
    needs: [unit, prepare-codex]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-codex.outputs.matrix) }}
    env:
      # Pinned 0.160.1 is the reproduction lane for the committed rollout fixtures. The
      # latest lane is the autoupdate alarm; both run against the same local mock and never
      # receive a real OpenAI credential.
      HARNESS_CI_REQUIRE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Codex ${{ matrix.version }}
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ matrix.version }}'
          echo "npm latest: $(npm view @openai/codex version)"
          prefix="$RUNNER_TEMP/codex-$requested"
          npm install --prefix "$prefix" --no-save --no-audit --no-fund "@openai/codex@$requested"
          bin="$prefix/node_modules/.bin/codex"
          actual="$("$bin" --version | head -n1 | awk '{print $2}')"
          test -n "$actual"
          if [[ "$actual" != "$requested" ]]; then
            echo "installed $actual, wanted $requested" >&2
            exit 1
          fi
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
          echo "CODEX_VERSION=$actual" >> "$GITHUB_ENV"
          echo "CODEX_BIN=$bin" >> "$GITHUB_ENV"
          echo "Testing Codex $actual"

      - name: Build harness-ci explicitly
        working-directory: harness-ci
        run: cargo build -p harness-driver --release --locked

      - name: Run Codex scenarios offline
        shell: bash
        run: |
          set -uo pipefail
          runs="$RUNNER_TEMP/codex-runs"
          rm -rf "$runs"
          mkdir -p "$runs"
          failed=0
          while IFS= read -r scenario; do
            [[ -z "$scenario" || "$scenario" == \#* ]] && continue
            echo "::group::$scenario ($CODEX_VERSION on ${{ runner.os }})"
            if ! harness-ci/ci/offline-run.sh \
              "$PWD/harness-ci/target/release/harness-driver" \
              --scenario "$PWD/harness-ci/driver/scenarios/$scenario.json" \
              --out "$runs/$scenario"; then
              failed=1
            fi
            echo "::endgroup::"
          done < harness-ci/ci/scenarios-codex.txt
          exit "$failed"

      - name: Survey transcript shape
        if: always()
        run: |
          python3 harness-ci/ci/survey.py survey \
            --runs "$RUNNER_TEMP/codex-runs" \
            --harness codex \
            --version "$CODEX_VERSION" \
            --os "${{ runner.os }}" \
            --out "$RUNNER_TEMP/codex-runs/shape.json"

      - name: Upload runs and shape
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-${{ matrix.label }}-${{ runner.os }}
          path: ${{ runner.temp }}/codex-runs
          if-no-files-found: warn
          retention-days: 7

  opencode:
    name: OpenCode ${{ matrix.label }} (${{ matrix.version }}) on ${{ matrix.os }}
    needs: [unit, prepare]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.opencode_matrix) }}
    env:
      HARNESS_CI_REQUIRE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenCode ${{ matrix.version }}
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ matrix.version }}'
          echo "npm latest OpenCode: $(npm view opencode-ai version)"
          prefix="$RUNNER_TEMP/opencode-$requested"
          npm install --prefix "$prefix" --no-save --no-audit --no-fund "opencode-ai@$requested"
          bin="$prefix/node_modules/.bin/opencode"
          actual="$("$bin" --version | head -n1 | tr -d '[:space:]')"
          test -n "$actual"
          if [[ "$actual" != "$requested" ]]; then
            echo "installed $actual, wanted $requested" >&2
            exit 1
          fi
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
          echo "OPENCODE_VERSION=$actual" >> "$GITHUB_ENV"
          echo "OPENCODE_BIN=$bin" >> "$GITHUB_ENV"
          echo "Testing OpenCode $actual"

      - name: Build harness-ci explicitly
        working-directory: harness-ci
        run: cargo build -p harness-driver --release --locked

      - name: Run OpenCode scenarios offline
        shell: bash
        run: |
          set -uo pipefail
          runs="$RUNNER_TEMP/opencode-runs"
          rm -rf "$runs"
          mkdir -p "$runs"
          failed=0
          while IFS= read -r scenario; do
            [[ -z "$scenario" || "$scenario" == \#* ]] && continue
            echo "::group::$scenario ($OPENCODE_VERSION on ${{ runner.os }})"
            if ! harness-ci/ci/offline-run.sh \
              "$PWD/harness-ci/target/release/harness-driver" \
              --scenario "$PWD/harness-ci/driver/scenarios/$scenario.json" \
              --out "$runs/$scenario"; then
              failed=1
            fi
            echo "::endgroup::"
          done < harness-ci/ci/scenarios-opencode.txt
          exit "$failed"

      - name: Upload runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ matrix.label }}-${{ runner.os }}
          path: ${{ runner.temp }}/opencode-runs
          if-no-files-found: warn
          retention-days: 7

  cursor:
    name: Cursor Agent ${{ matrix.label }} (${{ matrix.version }}) on ${{ matrix.os }}
    needs: [unit, prepare-cursor]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-cursor.outputs.matrix) }}
    env:
      # Cursor's CLI needs Cursor's backend for a chat, so the live PTY/mock path is not
      # available yet (A5). This lane still installs the pinned and latest CLI, proves the
      # binary launches with no network, and runs the offline fixture suite (including Cursor).
      HARNESS_CI_REQUIRE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version

      - name: Install Cursor Agent ${{ matrix.version }}
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ matrix.version }}'
          case "$(uname -s)" in
            Linux) os_name=linux ;;
            Darwin) os_name=darwin ;;
            *) echo "unsupported OS: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=x64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          prefix="$RUNNER_TEMP/cursor-$requested"
          archive="$RUNNER_TEMP/cursor-$requested.tar.gz"
          url="https://downloads.cursor.com/lab/$requested/$os_name/$arch/agent-cli-package.tar.gz"
          curl -fSL --retry 5 --retry-delay 2 --retry-all-errors "$url" -o "$archive"
          mkdir -p "$prefix"
          tar --strip-components=1 -xzf "$archive" -C "$prefix"
          rm -f "$archive"
          bin="$prefix/cursor-agent"
          actual="$("$bin" --version | head -n1 | awk '{print $1}')"
          test -n "$actual"
          if [[ "$actual" != "$requested" ]]; then
            echo "installed $actual, wanted $requested" >&2
            exit 1
          fi
          echo "$prefix" >> "$GITHUB_PATH"
          echo "CURSOR_VERSION=$actual" >> "$GITHUB_ENV"
          echo "CURSOR_BIN=$bin" >> "$GITHUB_ENV"
          echo "Testing Cursor Agent $actual"

      - name: Verify Cursor Agent launches offline
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/cursor-home"
          mkdir -p "$home"
          found="$(HOME="$home" harness-ci/ci/offline-run.sh "$CURSOR_BIN" --version | head -n1 | awk '{print $1}')"
          if [[ "$found" != "$CURSOR_VERSION" ]]; then
            echo "offline copy reported $found, wanted $CURSOR_VERSION" >&2
            exit 1
          fi
          HOME="$home" harness-ci/ci/offline-run.sh "$CURSOR_BIN" --help > "$RUNNER_TEMP/cursor-help.txt"
          grep -q "Usage:" "$RUNNER_TEMP/cursor-help.txt"

      - name: Run offline transcript/status fixtures (including Cursor)
        # The CLI chat path is backend-gated, so these are the transcript/status scenarios
        # the live matrix cannot drive. They still exercise the Cursor adapter end to end.
        run: cargo test --locked -p agenttail --test status_fixtures

      - name: Upload Cursor smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cursor-${{ matrix.label }}-${{ runner.os }}
          path: ${{ runner.temp }}/cursor-help.txt
          if-no-files-found: warn
          retention-days: 7

  gemini:
    name: Gemini CLI ${{ matrix.label }} (${{ matrix.version }}) on ${{ matrix.os }}
    needs: [unit, prepare-gemini]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-gemini.outputs.matrix) }}
    env:
      HARNESS_CI_REQUIRE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini CLI ${{ matrix.version }}
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ matrix.version }}'
          echo "Gemini CLI npm latest: $(npm view @google/gemini-cli version)"
          prefix="$RUNNER_TEMP/gemini-$requested"
          npm install --prefix "$prefix" --no-save --no-audit --no-fund "@google/gemini-cli@$requested"
          bin="$prefix/node_modules/.bin/gemini"
          actual="$("$bin" --version | head -n1 | tr -d '[:space:]')"
          test -n "$actual"
          if [[ "$actual" != "$requested" ]]; then
            echo "installed $actual, wanted $requested" >&2
            exit 1
          fi
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
          echo "GEMINI_VERSION=$actual" >> "$GITHUB_ENV"
          echo "GEMINI_BIN=$bin" >> "$GITHUB_ENV"
          echo "Testing Gemini CLI $actual"

      - name: Build harness-ci explicitly
        working-directory: harness-ci
        run: cargo build -p harness-driver --release --locked

      - name: Run Gemini CLI scenarios offline
        shell: bash
        run: |
          set -uo pipefail
          runs="$RUNNER_TEMP/gemini-runs"
          rm -rf "$runs"
          mkdir -p "$runs"
          failed=0
          while IFS= read -r scenario; do
            [[ -z "$scenario" || "$scenario" == \#* ]] && continue
            echo "::group::$scenario ($GEMINI_VERSION on ${{ runner.os }})"
            if ! harness-ci/ci/offline-run.sh \
              "$PWD/harness-ci/target/release/harness-driver" \
              --scenario "$PWD/harness-ci/driver/scenarios/$scenario.json" \
              --out "$runs/$scenario"; then
              failed=1
            fi
            echo "::endgroup::"
          done < harness-ci/ci/scenarios-gemini.txt
          exit "$failed"

      - name: Upload runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-${{ matrix.label }}-${{ runner.os }}
          path: ${{ runner.temp }}/gemini-runs
          if-no-files-found: warn
          retention-days: 7

  copilot:
    name: Copilot CLI ${{ matrix.label }} (${{ matrix.version }}) on ${{ matrix.os }}
    needs: [unit, prepare-copilot]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-copilot.outputs.matrix) }}
    env:
      HARNESS_CI_REQUIRE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Copilot CLI ${{ matrix.version }}
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ matrix.version }}'
          echo "Copilot CLI npm latest: $(npm view @github/copilot version)"
          prefix="$RUNNER_TEMP/copilot-$requested"
          npm install --prefix "$prefix" --no-save --no-audit --no-fund "@github/copilot@$requested"
          bin="$prefix/node_modules/.bin/copilot"
          actual="$("$bin" --version | head -n1 | awk '{print $4}' | tr -d '.')"
          test -n "$actual"
          if [[ "$actual" != "$requested" ]]; then
            echo "installed $actual, wanted $requested" >&2
            exit 1
          fi
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
          echo "COPILOT_VERSION=$actual" >> "$GITHUB_ENV"
          echo "COPILOT_BIN=$bin" >> "$GITHUB_ENV"
          echo "Testing Copilot CLI $actual"

      - name: Build harness-ci explicitly
        working-directory: harness-ci
        run: cargo build -p harness-driver --release --locked

      - name: Run Copilot CLI scenarios offline
        shell: bash
        run: |
          set -uo pipefail
          runs="$RUNNER_TEMP/copilot-runs"
          rm -rf "$runs"
          mkdir -p "$runs"
          failed=0
          while IFS= read -r scenario; do
            [[ -z "$scenario" || "$scenario" == \#* ]] && continue
            echo "::group::$scenario ($COPILOT_VERSION on ${{ runner.os }})"
            if ! harness-ci/ci/offline-run.sh \
              "$PWD/harness-ci/target/release/harness-driver" \
              --scenario "$PWD/harness-ci/driver/scenarios/$scenario.json" \
              --out "$runs/$scenario"; then
              failed=1
            fi
            echo "::endgroup::"
          done < harness-ci/ci/scenarios-copilot.txt
          exit "$failed"

      - name: Upload runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-${{ matrix.label }}-${{ runner.os }}
          path: ${{ runner.temp }}/copilot-runs
          if-no-files-found: warn
          retention-days: 7

  drift:
    name: Nightly drift PR
    needs: [unit, harness]
    if: >-
      always() && (
        github.event_name == 'schedule' ||
        github.event.inputs.open_drift_pr == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version

      - uses: actions/download-artifact@v4
        with:
          pattern: harness-*
          path: ${{ runner.temp }}/artifacts

      - name: Build the fixture redaction tool
        run: cargo build --locked -p agenttail-cli --release

      - name: Compare shapes and capture redacted fixtures
        id: compare
        shell: bash
        env:
          AGENTTAIL_BIN: ${{ github.workspace }}/target/release/agenttail
        run: |
          set +e
          python3 harness-ci/ci/nightly.py --artifacts "$RUNNER_TEMP/artifacts"
          status=$?
          set -e
          if [[ "$status" -eq 2 ]]; then
            echo "A committed baseline changed shape without a version change; not opening a PR." >&2
            exit 1
          fi
          exit "$status"

      - name: Scan captured fixtures for secrets and home paths
        run: target/release/agenttail fixture scan fixtures

      - name: Open a drift PR when shape changed
        if: steps.compare.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No shape changes; nothing to open."
            exit 0
          fi
          version="$(git status --porcelain harness-ci/drift/baseline \
            | awk '{print $2}' | sed -n 's#.*/\([^/]*\)\.json#\1#p' | sort -V | tail -n1)"
          if [[ -z "$version" ]]; then
            echo "Drift files changed but no baseline version was found" >&2
            git status --short >&2
            exit 1
          fi
          report="$(ls -t harness-ci/drift/reports/*-to-"$version".md | head -n1)"
          branch="harness-drift/claude-code-$version-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add harness-ci/drift fixtures
          git commit -m "Record Claude Code $version harness shape drift"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Harness drift: Claude Code $version" \
            --body-file "$report"
